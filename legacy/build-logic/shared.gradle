group = 'mrriegel.storagenetwork'
sourceSets.main.java.srcDir new File(repositoryRoot, 'common/src/main/java')
sourceSets.main.resources.srcDir new File(repositoryRoot, 'common/src/main/resources')
if (minecraftTarget != '1.7.10') {
    java.sourceCompatibility = JavaVersion.toVersion(javaTarget)
    java.targetCompatibility = JavaVersion.toVersion(javaTarget)
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (minecraftTarget == '1.8.9') options.release.set(8)
    if (minecraftTarget != '1.7.10') options.compilerArgs.add('-Xlint:-options')
}
if (javaTarget == 8) apply from: new File(repositoryRoot, 'build-logic/java8-verification.gradle')
def generatedJava = layout.buildDirectory.dir('generated/storagenetwork/java')
sourceSets.main.java.srcDir generatedJava
tasks.register('generateVersion') {
    inputs.property('fullVersion', { modVersionState.fullVersion })
    outputs.dir generatedJava
    doLast {
        def destination = new File(generatedJava.get().asFile, 'mrriegel/storagenetwork/legacy/BuildVersion.java')
        destination.parentFile.mkdirs()
        destination.text = "package mrriegel.storagenetwork.legacy; public final class BuildVersion { public static final String VERSION = \"${modVersionState.fullVersion}\"; private BuildVersion() {} }\n"
    }
}
compileJava.dependsOn 'generateVersion'
processResources {
    inputs.property('fullVersion', { modVersionState.fullVersion })
    filesMatching('mcmod.info') { expand(fullVersion: modVersionState.fullVersion, minecraftTarget: minecraftTarget) }
    from(new File(repositoryRoot, 'LICENSE.txt'))
}
jar {
    manifest { attributes 'Implementation-Title': 'Simple Storage Network', 'Implementation-Version': project.fullVersion }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jar.doFirst { manifest.attributes('Implementation-Version': modVersionState.fullVersion) }
