import java.nio.file.Files
import java.nio.file.LinkOption
import java.util.regex.Pattern

def repository = rootDir.toPath()
def targets = project.ext.minecraftTargets

tasks.register('pruneBuilds') {
    group = 'build'
    description = 'Removes obsolete production test JARs while preserving the newest artifact for each Minecraft target.'
    // Deliberately has no dependencies or finalizers: pruning is always opt-in.
    doLast {
        def root = repository.toRealPath()
        def lock = root.resolve('.build-number.lock')
        try {
            Files.createDirectory(lock)
        } catch (java.nio.file.FileAlreadyExistsException e) {
            throw new GradleException('Another production build or pruneBuilds owns .build-number.lock; retry when it finishes.', e)
        }
        try {
            def verification = new groovy.json.JsonSlurper().parse(root.resolve('verification.json').toFile())
            targets.each { mc ->
                def name = verification.archive_pattern.replace('{mod_id}', verification.mod_id)
                        .replace('{mc}', mc)
                // Match only the complete production name, never classifier suffixes or other mods.
                def parts = name.split(Pattern.quote('{full_version}'), -1)
                if (parts.length != 2 || parts.any { it.contains('{') || it.contains('}') } ||
                        name.contains('/') || name.contains('\\') || !name.endsWith('.jar')) {
                    throw new GradleException('pruneBuilds requires a production archive_pattern with exactly one {full_version} and no directories.')
                }
                def pattern = Pattern.compile(Pattern.quote(parts[0]) +
                        '[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?' + Pattern.quote(parts[1]))
                // Retire the old production scheme during the naming transition, too.
                def legacyPattern = Pattern.compile(Pattern.quote(verification.mod_id + '-') +
                        '[0-9]+\\.[0-9]+\\.[0-9]+-legacy\\.[0-9]+' + Pattern.quote("+mc${mc}-forge.jar"))
                // Unimined/GTNH/LegacyForge final remap/reobf output, in-place FG output,
                // and native NeoForge jar output all end here. Never descend into caches.
                def directory = root.resolve("versions/${mc}/build/libs")
                if (!Files.exists(directory, LinkOption.NOFOLLOW_LINKS)) {
                    logger.lifecycle("${mc}: no production JARs; nothing to prune.")
                    return
                }
                if (!Files.isDirectory(directory, LinkOption.NOFOLLOW_LINKS) || directory.toRealPath() != directory) {
                    throw new GradleException("Refusing to prune a redirected output directory: ${directory}")
                }
                def artifacts = []
                Files.newDirectoryStream(directory).withCloseable { entries ->
                    entries.each { path ->
                        def filename = path.fileName.toString()
                        if (Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS) &&
                                !filename.endsWith('-dev.jar') && !filename.endsWith('-sources.jar') &&
                                !filename.endsWith('-javadoc.jar') &&
                                (pattern.matcher(filename).matches() || legacyPattern.matcher(filename).matches())) {
                            artifacts.add([path: path, modified: Files.getLastModifiedTime(path, LinkOption.NOFOLLOW_LINKS)])
                        }
                    }
                }
                if (artifacts.empty) {
                    logger.lifecycle("${mc}: no production JARs; nothing to prune.")
                    return
                }
                // Rebuilding a public version overwrites its filename: creation time is stale.
                artifacts.sort { a, b ->
                    def order = a.modified.compareTo(b.modified)
                    order != 0 ? order : a.path.toString().compareTo(b.path.toString())
                }
                def retained = artifacts.last().path
                logger.lifecycle("${mc}: retained ${retained.fileName} using lastModifiedTime.")
                if (artifacts.size() == 1) {
                    logger.lifecycle("${mc}: one production JAR; nothing to prune.")
                } else {
                    artifacts.take(artifacts.size() - 1).each { artifact ->
                        Files.delete(artifact.path)
                        logger.lifecycle("${mc}: deleted ${artifact.path.fileName}.")
                    }
                }
            }
        } finally {
            Files.deleteIfExists(lock)
        }
    }
}
