plugins { id 'base' }
ext.minecraftTargets = ['1.6.4', '1.7.10', '1.8.9']
apply from: 'build-logic/prune-builds.gradle'
def python = providers.environmentVariable('PYTHON').orElse('python')
def launch = { String name, List<String> arguments ->
    tasks.register(name, Exec) {
        group = 'multiversion'
        workingDir rootDir
        commandLine([python.get(), file('scripts/build.py').absolutePath] + arguments)
    }
}
minecraftTargets.each { mc ->
    launch("build${mc.replace('.', '_')}", ['build', mc])
    launch("test${mc.replace('.', '_')}", ['test', mc, '--skip-common-tests']).configure { dependsOn ':common:classes' }
    launch("runClient${mc.replace('.', '_')}", ['client', mc])
    launch("runServer${mc.replace('.', '_')}", ['server', mc])
}
launch('buildAll', ['all', '--skip-common-tests']).configure { dependsOn ':common:classes' }
launch('testAll', ['test', '--skip-common-tests']).configure { dependsOn ':common:classes' }
tasks.named('buildAll') { mustRunAfter 'testAll' }
tasks.named('check') { dependsOn 'testAll' }
tasks.named('build') { dependsOn 'buildAll' }
